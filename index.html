<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>책상 위 젤리 친구</title>
<style>
:root{--g1:#eaffc9;--g2:#c8f28c;--g3:#8fdc3a;--ink:#1f4a06;--yel:#ffe45c;--cream:#fffbe8;--sub:#4f7a22}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#d9f5ae;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-user-select:none;user-select:none}
#xrcanvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;display:none}
#app{position:fixed;inset:0;z-index:1}
#app canvas{display:block;touch-action:none}
.hidden{display:none!important}

/* ── 시작 화면 ── */
#intro{position:fixed;inset:0;z-index:3;overflow:hidden;background:radial-gradient(120% 70% at 50% 35%,#f6ffe4 0%,var(--g1) 40%,var(--g2) 100%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(56px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom))}
#intro .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(143,220,58,.25) 3px,transparent 3.5px);background-size:28px 28px;pointer-events:none}
.blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none}
.deco{position:absolute;pointer-events:none}
.hello{position:relative;text-align:center;color:var(--ink)}
.hello b{display:block;font-size:30px;font-weight:900;letter-spacing:-.5px}
.hello span{display:block;margin-top:8px;font-size:15px;color:var(--sub)}
.stagepic{position:relative;width:240px;height:260px;flex:none}
.stagepic .plate{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:220px;height:44px;border-radius:50%;background:radial-gradient(#b9e57a,#9bd456);border:3px solid var(--ink)}
.stagepic svg.jelly{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);animation:boing 1.1s ease-in-out infinite;transform-origin:50% 100%}
@keyframes boing{0%,100%{transform:translateX(-50%) scale(1.06,.94)}50%{transform:translateX(-50%) translateY(-14px) scale(.96,1.04)}}
@media (prefers-reduced-motion:reduce){.stagepic svg.jelly{animation:none}}
.ctas{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.cta{display:flex;align-items:center;justify-content:center;width:min(270px,100%);height:66px;border-radius:999px;background:linear-gradient(#a8ea55,var(--g3));border:3px solid var(--ink);box-shadow:inset 0 6px 0 rgba(255,255,255,.55),0 6px 0 var(--ink);font-weight:900;font-size:21px;line-height:1;color:var(--ink);cursor:pointer;text-decoration:none;font-family:inherit}
.cta:active{transform:translateY(4px);box-shadow:inset 0 6px 0 rgba(255,255,255,.55),0 2px 0 var(--ink)}
.cta[disabled]{opacity:.55;pointer-events:none}
#ql{display:block;line-height:0}
#ql img{width:270px;height:72px;display:block}
#ql.wait{opacity:.55;pointer-events:none}
.sub{background:none;border:0;font-weight:600;font-size:15px;line-height:1;color:var(--sub);padding:10px;cursor:pointer;font-family:inherit}
#intro-msg{position:relative;font-size:12.5px;color:#5e8338;text-align:center;line-height:1.5;white-space:pre-line;min-height:19px}

/* ── 놀이 화면 (프레임 + 버튼) ── */
#hud{position:fixed;inset:0;z-index:2;pointer-events:none;display:none}
#hud.on{display:block}
.frame{position:absolute;inset:0;border:14px solid var(--g2);border-radius:44px;box-shadow:inset 0 0 0 3px var(--ink),inset 0 0 0 9px rgba(255,255,255,.5)}
@media (min-width:700px){.frame{border-radius:28px}}
#hint{position:absolute;left:50%;top:max(58px,calc(env(safe-area-inset-top) + 40px));transform:translateX(-50%);background:rgba(255,251,232,.95);border:2.5px solid var(--ink);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;max-width:calc(100% - 140px);overflow:hidden;text-overflow:ellipsis}
#close{position:absolute;top:max(50px,calc(env(safe-area-inset-top) + 32px));right:30px;width:46px;height:46px;border-radius:50%;background:var(--cream);border:3px solid var(--ink);font-weight:900;font-size:20px;line-height:1;color:var(--ink);pointer-events:auto;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#mute{position:absolute;top:max(50px,calc(env(safe-area-inset-top) + 32px));left:30px;width:46px;height:46px;border-radius:50%;background:var(--cream);border:3px solid var(--ink);pointer-events:auto;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#mute .off{display:none}#mute.muted .on{display:none}#mute.muted .off{display:block}
#loading{position:fixed;inset:0;z-index:4;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(120% 70% at 50% 40%,#f6ffe4 0%,var(--g1) 40%,var(--g2) 100%);color:var(--ink);text-align:center;padding:24px}
#loading.on{display:flex}
#loading .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(143,220,58,.25) 3px,transparent 3.5px);background-size:28px 28px;pointer-events:none}
#loading .pic{position:relative;width:150px;height:200px}
#loading .pic svg{position:absolute;left:50%;bottom:10px;transform-origin:50% 100%;animation:boing .9s ease-in-out infinite}
#loading .shadowdot{position:absolute;left:50%;bottom:0;width:110px;height:18px;margin-left:-55px;border-radius:50%;background:rgba(31,74,6,.18);animation:sh .9s ease-in-out infinite}
@keyframes sh{0%,100%{transform:scale(1)}50%{transform:scale(.75)}}
#loading b{position:relative;font-size:22px;font-weight:900}
#loading p{position:relative;margin:0;font-size:14px;color:var(--sub);line-height:1.5;white-space:pre-line}
#loading .pw{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));font-size:11px;color:#6b8f45;opacity:.8}
#loading .cta{position:relative}
#bar{position:absolute;left:24px;right:24px;bottom:max(32px,calc(env(safe-area-inset-bottom) + 18px));max-width:460px;margin:0 auto;height:108px;border-radius:30px;background:linear-gradient(#f2ffd9,var(--g2));border:3px solid var(--ink);box-shadow:inset 0 5px 0 rgba(255,255,255,.7),0 5px 0 var(--ink);display:flex;justify-content:space-around;align-items:center;padding:0 4px;pointer-events:auto}
#bar button{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:4px 0;font-weight:800;font-size:12px;line-height:1;color:var(--ink);cursor:pointer;font-family:inherit;min-width:56px}
#bar i{width:52px;height:52px;border-radius:50%;background:var(--cream);border:3px solid var(--ink);box-shadow:inset 0 -5px 0 rgba(143,220,58,.35);display:flex;align-items:center;justify-content:center;transition:transform .12s}
#bar button.on i{background:var(--yel)}
#bar button:active i{transform:scale(.9)}
#bar.off{opacity:.5;pointer-events:none}
</style>
<script type="importmap">

</script>
</head>
<body>

  <svg class="deco" style="left:2px;top:50%" width="30" height="38" viewBox="0 0 20 26"><path d="M10 2C10 2 2 12 2 17a8 8 0 0 0 16 0C18 12 10 2 10 2z" fill="#dff7ff" stroke="#1f4a06" stroke-width="1.6"/></svg>
  <svg class="deco" style="right:2px;top:66%" width="40" height="40" viewBox="0 0 24 24"><path d="M12 2l2.6 6.6L21 9.3l-5 4.4 1.6 6.8L12 17l-5.6 3.5L8 13.7 3 9.3l6.4-.7z" fill="#c8f28c" stroke="#1f4a06" stroke-width="1.4" stroke-linejoin="round"/></svg>

    <button data-act="thud"><i><svg width="30" height="26" viewBox="0 0 30 24"><text x="15" y="18" text-anchor="middle" font-weight="900" font-size="15" fill="#1f4a06">쿵</text></svg></i>쿵</button>
    <button data-act="surprise"><i><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1f4a06" stroke-width="3" stroke-linecap="round"><path d="M12 4v10"/><circle cx="12" cy="19.5" r="1.2" fill="#1f4a06"/></svg></i>놀라기</button>
    <button data-act="eat"><i><svg width="30" height="26" viewBox="0 0 30 24"><path d="M3 7l5 5-5 5zM27 7l-5 5 5 5z" fill="#ffb3c7" stroke="#1f4a06" stroke-width="1.6" stroke-linejoin="round"/><ellipse cx="15" cy="12" rx="8" ry="6.5" fill="#ff8fb0" stroke="#1f4a06" stroke-width="2"/><path d="M11 10q2-2 4-1" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></i>먹기</button>
  </div>
</div>

<!-- 로딩 화면 -->
<div id="loading">
  <div class="dots"></div>
  <div class="pic"><div class="shadowdot"></div><div id="loading-jelly"></div></div>
  <b id="loading-title">친구를 부르는 중…</b>
  <p id="loading-msg">카메라를 켜고 있어요</p>
  <button id="loading-back" class="cta hidden" style="width:200px;height:56px;font-size:18px">처음으로</button>
  <div class="pw">powered by 8th Wall</div>
</div>

<!-- 시작 화면 -->
<div id="intro">
  <div class="dots"></div>
  <div class="blob" style="width:140px;height:140px;left:-40px;top:40px"></div>
  <div class="blob" style="width:90px;height:90px;right:-20px;top:38%"></div>
  <div class="blob" style="width:60px;height:60px;left:30px;bottom:26%"></div>
  <svg class="deco" style="left:40px;top:30%" width="34" height="34" viewBox="0 0 24 24"><path d="M12 2l2.6 6.6L21 9.3l-5 4.4 1.6 6.8L12 17l-5.6 3.5L8 13.7 3 9.3l6.4-.7z" fill="#ffe45c" stroke="#1f4a06" stroke-width="1.6" stroke-linejoin="round"/></svg>
  <svg class="deco" style="right:44px;top:26%" width="26" height="26" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="#ffb3c7" stroke="#1f4a06" stroke-width="1.6"/></svg>
  <svg class="deco" style="right:60px;top:60%" width="22" height="28" viewBox="0 0 20 26"><path d="M10 2C10 2 2 12 2 17a8 8 0 0 0 16 0C18 12 10 2 10 2z" fill="#dff7ff" stroke="#1f4a06" stroke-width="1.6"/></svg>
  <div class="hello"><b>안녕! 같이 놀자</b><span>책상을 비추고 톡 눌러서 친구를 불러요</span></div>
  <div class="stagepic"><div class="plate"></div>
    <!-- 시작 화면용 젤리 실루엣 (그림) -->

  <div class="ctas">

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
window.THREE = THREE;   // 8th Wall 엔진이 이 three.js를 쓰게 하기

/* ───────── 설정 ───────── */
const MODEL_URL = 'character.glb';
const AR_SIZE = 0.25;   // AR에서 캐릭터 크기 (폰~책상 거리를 1로 볼 때. 보통 키 8~10cm 정도)
const ENGINE = [
  'https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js',
  'https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js',
];

const UA = navigator.userAgent;
const isMobile = /iPad|iPhone|iPod|Android|Mobi/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const $ = (id) => document.getElementById(id);
const introMsg = (t) => { $('intro-msg').textContent = t; };

/* ───────── PC 미리보기용 장면 ───────── */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
$('app').appendChild(renderer.domElement);
const previewScene = new THREE.Scene();
previewScene.background = new THREE.Color().setRGB(1.0, 0.92, 0.74, THREE.LinearSRGBColorSpace);
const previewCam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 60);
const controls = new OrbitControls(previewCam, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 2; controls.maxDistance = 7; controls.maxPolarAngle = Math.PI * 0.47; controls.enabled = false;
const disc = new THREE.Group();
disc.add(new THREE.Mesh(new THREE.CircleGeometry(1.7, 64).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: new THREE.Color().setRGB(0.62, 0.86, 0.33, THREE.LinearSRGBColorSpace) })));
const rim = new THREE.Mesh(new THREE.RingGeometry(1.7, 1.76, 64).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: new THREE.Color().setRGB(0.02, 0.12, 0, THREE.LinearSRGBColorSpace) }));
rim.position.y = 0.001; disc.add(rim); previewScene.add(disc);

/* ───────── 툰 재질 (블렌더 노드 색 그대로) ───────── */
const L = (r, g, b) => new THREE.Color().setRGB(r, g, b, THREE.LinearSRGBColorSpace);
const PALETTE = {
  Jelly_Body:   { shadow: L(0.165,0.581,0.048), lit: L(0.321,0.971,0.074), rim: L(0.75,1,0.295),  spec: 0.9 },
  Jelly_Green:  { shadow: L(0.165,0.581,0.048), lit: L(0.321,0.971,0.074), rim: L(0.75,1,0.295),  spec: 0.9 },
  Jelly_Lip:    { shadow: L(0.295,0.75,0.087),  lit: L(0.581,1,0.191),     rim: L(0.88,1,0.49),   spec: 0.6 },
  Eye_Navy:     { shadow: L(0.0,0.01,0.06),     lit: L(0.01,0.03,0.12),    rim: L(0.01,0.03,0.12),spec: 1.0 },
  Cheek_Yellow: { shadow: L(0.45,0.62,0.05),    lit: L(0.62,0.82,0.1),     rim: L(0.62,0.82,0.1), spec: 0.3 },
  Candy:        { shadow: L(0.85,0.25,0.42),    lit: L(1.0,0.45,0.62),     rim: L(1.0,0.8,0.88),  spec: 1.0 },
};
function toonMaterial(p) {
  return new THREE.ShaderMaterial({
    uniforms: { uShadow: { value: p.shadow }, uLit: { value: p.lit }, uRim: { value: p.rim }, uSpec: { value: p.spec },
      uLight: { value: new THREE.Vector3(0.45, 0.75, 0.5).normalize() } },
    vertexShader: `varying vec3 vN; varying vec3 vV;
      void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform vec3 uShadow, uLit, uRim, uLight; uniform float uSpec; varying vec3 vN; varying vec3 vV;
      void main(){ vec3 n = normalize(vN); vec3 v = normalize(vV);
        float d = dot(n, uLight) * 0.5 + 0.5;
        vec3 c = mix(uShadow, uLit, smoothstep(0.45, 0.5, d));
        float rim = smoothstep(0.55, 0.75, 1.0 - max(dot(n, v), 0.0));
        c = mix(c, uRim, rim * 0.7);
        float sp = smoothstep(0.965, 0.975, dot(n, normalize(uLight + v)));
        c = mix(c, vec3(1.0, 1.0, 0.88), sp * uSpec);
        gl_FragColor = vec4(c, 1.0);
        #include <colorspace_fragment>
      }`,
  });
}
const outlineMat = new THREE.MeshBasicMaterial({ color: L(0.02, 0.12, 0.0) });
const eyeMat = toonMaterial(PALETTE.Eye_Navy);

/* ───────── 캐릭터 뼈대 ─────────
   stage(위치·방향·크기) → hopper(점프·기울기) → tipper(넘어지기) → squasher(찌부) → model */
const stage = new THREE.Group(); stage.visible = false;
const hopper = new THREE.Group(); stage.add(hopper);
const tipper = new THREE.Group(); hopper.add(tipper);
const squasher = new THREE.Group(); tipper.add(squasher);

function radialTex() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(64, 64, 8, 64, 64, 64);
  gr.addColorStop(0, 'rgba(40,60,10,0.45)'); gr.addColorStop(1, 'rgba(40,60,10,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 1.1).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ map: radialTex(), transparent: true, depthWrite: false }));
shadow.position.y = 0.004; shadow.renderOrder = -1; stage.add(shadow);

// 먹기용 사탕
const candy = new THREE.Group();
{
  const m = toonMaterial(PALETTE.Candy);
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.075, 24, 16), m); ball.scale.set(1.25, 1, 1);
  const wl = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.07, 16), m); wl.rotation.z = -Math.PI / 2; wl.position.x = -0.12;
  const wr = wl.clone(); wr.rotation.z = Math.PI / 2; wr.position.x = 0.12;
  const ol = new THREE.Mesh(new THREE.SphereGeometry(0.083, 24, 16), new THREE.MeshBasicMaterial({ color: L(0.02, 0.12, 0), side: THREE.BackSide })); ol.scale.set(1.25, 1, 1);
  candy.add(ball, wl, wr, ol); candy.visible = false; stage.add(candy);
}

        const u = t / 2.6;
        P.spin = Math.sin(u * Math.PI * 2) * 0.6 * Math.sin(u * Math.PI); P.eyeScale = 1.1;
        P.roll = Math.sin(u * Math.PI * 4) * 0.04; P.armL = 0.15; P.armR = -0.15;
        break;
      }
      case 'yawn': {   // 하아암~
        const u = clamp01(t / 2.3), up = Math.sin(clamp01(t / 1.4) * Math.PI);
        P.sq = 1 + 0.12 * up; P.mouth = 1.4 * up; P.eye = up > 0.3 ? 'closed' : 'normal';
        P.armL = 1.3 * up; P.armR = -1.3 * up; P.lean = -0.12 * up; P.roll = 0.04 * Math.sin(u * 6);
        break;
      }
      case 'doze': {   // 꾸벅꾸벅 + Zzz
        const nod = Math.max(0, Math.sin(t * 1.6));
        P.eye = 'closed'; P.lean = 0.08 + 0.18 * nod; P.sq = 0.98 + 0.03 * Math.sin(t * 1.6);
        P.armL = -0.05; P.armR = 0.05; P.cheek = 1.1;
        if (t >= (f.nextZ ?? 0.6)) { f.nextZ = (f.nextZ ?? 0.6) + 1.3; SFX.snore(); spawn('zzz', new THREE.Vector3(0.25, 1.05, 0.1), { life: 2.2, size: 0.2, vx: 0.12 }); }
        break;
      }
    }
    if (act.t >= DUR[act.type]) endAct();
  }

  const n = Math.max(1, Math.ceil(dt / (1 / 120))), h = dt / n;
  for (let i = 0; i < n; i++) { stepSpring(SQ, P.sq, 170, 8.5, h); stepSpring(LEAN, P.lean, 120, 9, h); stepSpring(ROLL, P.roll, 140, 10, h); }
  const sq = THREE.MathUtils.clamp(SQ.x, 0.7, 1.3), wide = 1 / Math.sqrt(sq);   // 부피 유지
  squasher.scale.set(wide, sq, wide);
  hopper.position.y = P.y;
  hopper.rotation.set(LEAN.x, P.spin, ROLL.x);
  tipper.rotation.x = P.tip;

  const lag = (name, field, target, rate) => { const o = parts[name]; o.userData[field] = THREE.MathUtils.damp(o.userData[field] ?? target, target, rate, dt); return o.userData[field]; };
  for (const [nm, tgt, sgn] of [['Jelly_Arm_L', P.armL, 1], ['Jelly_Arm_R', P.armR, -1]]) {
    if (!parts[nm]) continue;
    parts[nm].quaternion.copy(base[nm].q).premultiply(tmpQ.setFromAxisAngle(Z, lag(nm, 'a', tgt + (wide - 1) * 2 * sgn, 14)));
  }
  for (const [nm, tgt] of [['Jelly_Foot_L', P.footL], ['Jelly_Foot_R', P.footR]]) if (parts[nm]) parts[nm].position.y = base[nm].p.y + lag(nm, 'f', tgt, 18);
  const blink = (breathT % 3.4) < 0.12 && P.eye === 'normal' ? 0.15 : 1;
  for (const [nm, key] of [['Jelly_Eye_L', 'L'], ['Jelly_Eye_R', 'R']]) {
    const o = parts[nm]; if (!o) continue;
    const es = lag(nm, 'e', P.eyeScale, 16);
    o.visible = P.eye === 'normal';
    o.scale.set(base[nm].s.x * es, base[nm].s.y, base[nm].s.z * es * blink);
    if (chevrons[key]) { chevrons[key].happy.visible = P.eye === 'happy'; chevrons[key].closed.visible = P.eye === 'closed'; }
  }
  for (const nm of ['Jelly_Cheek_L', 'Jelly_Cheek_R']) {
    const o = parts[nm]; if (!o) continue;
    const c = lag(nm, 'c', P.cheek, 12);
    o.scale.set(base[nm].s.x * c, base[nm].s.y * (1 + (c - 1) * 1.5), base[nm].s.z * c);
  }
  // 입 벌리기: 윗입술은 살짝 위로, 아랫입술은 아래로
  const mo = parts.Jelly_Lip_0 ? lag('Jelly_Lip_0', 'm', P.mouth, 20) : 0;
  if (parts.Jelly_Lip_0) parts.Jelly_Lip_0.position.y = base.Jelly_Lip_0.p.y + mo * 0.03;
  if (parts.Jelly_Lip_1) parts.Jelly_Lip_1.position.y = base.Jelly_Lip_1.p.y - mo * 0.07;

  const tipK = P.tip / 1.48;
  shadow.scale.set(1 - P.y * 0.8, 1, (1 - P.y * 0.8) * (1 + tipK * 0.9));
  shadow.position.set(Math.sin(P.spin) * tipK * 0.45, 0.004, Math.cos(P.spin) * tipK * 0.45);
  shadow.rotation.y = P.spin;

  if (popT < 1) popT = Math.min(1, popT + dt / 0.45);
  stage.scale.setScalar(S * Math.max(0.001, elasticOut(popT)));
  updateFx(dt);
}

/* ───────── 놓기 · 걷기 · 탭 ───────── */
let activeCam = previewCam;
const raycaster = new THREE.Raycaster();
const FLOOR_Y = 0;
function placeAt(pt) {
  stage.position.set(pt.x, FLOOR_Y, pt.z);
  const cp = activeCam.getWorldPosition(new THREE.Vector3());
  stage.rotation.y = Math.atan2(cp.x - pt.x, cp.z - pt.z);
  wakeIfDozing(); stage.visible = true; placed = true; popT = 0; walk = null; endAct(); SQ.x = 1; SQ.v = 0; idleT = 0; SFX.appear();
  $('bar').classList.remove('off');
  $('hint').textContent = mode === 'ar' ? '탭: 걸어가기 · 두 번 탭: 이동 · 친구를 탭: 쓰다듬기' : '클릭: 걸어가기 · 더블클릭: 이동 · 친구 클릭: 쓰다듬기';
}
function clampPt(pt) {
  if (mode === 'ar') {   // 너무 멀리는 못 가게
    const cp = activeCam.getWorldPosition(new THREE.Vector3());
    tmpV.set(pt.x - cp.x, 0, pt.z - cp.z); const m = 3.5 * S * 4;
    if (tmpV.length() > m) { tmpV.setLength(m); pt.set(cp.x + tmpV.x, FLOOR_Y, cp.z + tmpV.z); }
  } else { const r = Math.hypot(pt.x, pt.z); if (r > 1.5) pt.multiplyScalar(1.5 / r); }
  pt.y = FLOOR_Y; return pt;
}
function rayFloor(ray) {
  if (ray.dir.y > -0.02) return null;
  const t = (FLOOR_Y - ray.origin.y) / ray.dir.y; if (t <= 0) return null;
  return clampPt(ray.origin.clone().addScaledVector(ray.dir, t));
}
function hitsCharacter(ray) {
  if (!placed || !model) return false;
  raycaster.set(ray.origin, ray.dir);
  return raycaster.intersectObjects(meshes, false).length > 0;
}
let pending = null;
function handleTap(ray) {
  audioOn(); idleT = 0;
  if (!placed) { const pt = rayFloor(ray); if (pt) placeAt(pt); return; }   // 첫 탭: 그 자리에 바로 등장
  const now = performance.now();
  if (pending && now - pending.time < 300) {             // 두 번 탭: 그 자리로 순간이동
    clearTimeout(pending.timer); pending = null;
    const pt = rayFloor(ray); if (pt) placeAt(pt); return;
  }
  const p = { time: now };
  p.timer = setTimeout(() => {                            // 한 번 탭: 쓰다듬기 또는 걸어가기
    pending = null;
    if (hitsCharacter(ray)) play('pat');
    else { const pt = rayFloor(ray); if (pt) { wakeIfDozing(); walk = { target: pt, phase: 0, step: 0 }; endAct(); } }
  }, 280);
  pending = p;
}
function bindTaps(el) {
  let down = null;
  el.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  el.addEventListener('pointerup', (e) => {
    if (!down || mode === 'none') return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dur = performance.now() - down.t; down = null;
    if (moved > 12 || dur > 450) return;
    const r = el.getBoundingClientRect();
    raycaster.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), activeCam);
    handleTap({ origin: raycaster.ray.origin.clone(), dir: raycaster.ray.direction.clone() });
  });
}
bindTaps(renderer.domElement);
bindTaps($('xrcanvas'));
$('xrcanvas').addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

/* ───────── 폰: 8th Wall AR ───────── */
let engineReady = null, clockLast = 0, xrStarted = false;
function loadEngine() {
  if (!engineReady) engineReady = new Promise((resolve, reject) => {
    let left = ENGINE.length;
    for (const src of ENGINE) {
      const s = document.createElement('script'); s.src = src; s.crossOrigin = 'anonymous';
      if (src.includes('engine-binary')) { s.async = true; s.dataset.preloadChunks = 'slam'; }
      s.onload = () => { if (--left === 0) (window.XR8 ? resolve() : window.addEventListener('xrloaded', () => resolve(), { once: true })); };
      s.onerror = () => reject(new Error('engine load failed'));
      document.head.appendChild(s);
    }
  });
  return engineReady;
}
function showLoading(title, msg, err) {
  $('loading-title').textContent = title; $('loading-msg').textContent = msg;
  $('loading-back').classList.toggle('hidden', !err); $('loading').classList.add('on');
}
const hideLoading = () => $('loading').classList.remove('on');
$('loading-back').addEventListener('click', () => { hideLoading(); backToIntro(); });
const jellyModule = () => ({
  name: 'jellybuddy',
  onCameraStatusChange: ({ status }) => {
    if (status === 'requesting') showLoading('친구를 부르는 중…', '카메라 사용을 허용해 주세요');
    else if (status === 'failed') showLoading('카메라를 켜지 못했어요', '브라우저 설정에서 카메라 권한을 허용하고\n다시 시작해 주세요', true);
  },
  onException: (err) => { console.error('XR exception', err); if (!xrStarted) showLoading('문제가 생겼어요', '카메라와 센서를 쓸 수 없는 환경이에요.\n폰의 크롬·사파리·카카오톡에서 열어 주세요', true); },
  onStart: () => {
    xrStarted = true; hideLoading();
    const { scene, camera } = XR8.Threejs.xrScene();
    activeCam = camera;
    camera.position.set(0, 1, 0);   // 폰~책상 거리를 1로
    XR8.XrController.updateCameraProjectionMatrix({ origin: camera.position, facing: camera.quaternion });
    scene.add(stage);
    clockLast = performance.now();
  },
  onUpdate: () => {
    const now = performance.now(); const dt = Math.min((now - clockLast) / 1000, 1 / 20); clockLast = now;
    if (model && stage.visible) animate(dt);
  },
});
async function startAR() {
  audioOn();
  // 아이폰: 움직임 센서 권한은 버튼을 누른 바로 그 순간에 물어봐야 해요
  try { if (window.DeviceMotionEvent && DeviceMotionEvent.requestPermission) DeviceMotionEvent.requestPermission().catch(() => {}); } catch (e) {}
  $('btn-start').disabled = true; showLoading('친구를 부르는 중…', '카메라를 켜고 있어요');
  try { await loadEngine(); } catch (e) { showLoading('AR 엔진을 불러오지 못했어요', '인터넷 연결을 확인하고 다시 시작해 주세요', true); $('btn-start').disabled = false; return; }
  xrStarted = false; mode = 'ar'; S = AR_SIZE; placed = false; stage.visible = false; walk = null; endAct(); clearFx();
  $('intro').classList.add('hidden'); $('hud').classList.add('on'); $('bar').classList.add('off');
  $('hint').textContent = '책상을 비추고 원하는 곳을 톡 눌러 주세요';
  $('app').style.display = 'none'; $('xrcanvas').style.display = 'block';
  XR8.clearCameraPipelineModules();
  XR8.addCameraPipelineModules([
    XR8.GlTextureRenderer.pipelineModule(),
    XR8.Threejs.pipelineModule(),
    XR8.XrController.pipelineModule(),
    XRExtras.FullWindowCanvas.pipelineModule(),
    XRExtras.RuntimeError.pipelineModule(),
    jellyModule(),
  ]);
  XR8.run({ canvas: $('xrcanvas'), allowedDevices: XR8.XrConfig.device().ANY });
  $('btn-start').disabled = false;
}

/* ───────── PC: 화면 속에서 놀기 ───────── */
function startPreview() {
  audioOn();
  mode = 'preview'; S = 1; activeCam = previewCam; clearFx();
  previewScene.add(stage);
  previewCam.position.set(0, 1.5, 4.2); controls.target.set(0, 0.45, 0); controls.enabled = true; controls.update();
  $('intro').classList.add('hidden'); $('hud').classList.add('on'); $('bar').classList.add('off');
  placeAt(new THREE.Vector3(0, 0, 0));
}
function backToIntro() {
  hideLoading();
  if (mode === 'ar' && window.XR8) { try { XR8.stop(); XR8.clearCameraPipelineModules(); } catch (e) {} }
  mode = 'none'; placed = false; stage.visible = false; controls.enabled = false; walk = null; endAct(); clearFx();
  $('xrcanvas').style.display = 'none'; $('app').style.display = '';
  $('hud').classList.remove('on'); $('intro').classList.remove('hidden');
}
$('close').addEventListener('click', backToIntro);
document.querySelectorAll('#bar button').forEach((b) => b.addEventListener('click', () => play(b.dataset.act)));
$('btn-start').addEventListener('click', () => (isMobile ? startAR() : startPreview()));

/* ───────── 시작 ───────── */
{ const j = document.querySelector('.stagepic svg.jelly').cloneNode(true); j.setAttribute('class', ''); j.style.transform = 'translateX(-50%)'; $('loading-jelly').appendChild(j); }
(async () => {
  if (isMobile) loadEngine().catch(() => {});   // 미리 불러 두기
  try { setupModel(await new GLTFLoader().loadAsync(MODEL_URL)); }
  catch (e) { console.error(e); introMsg('친구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'); return; }
  $('btn-start').classList.remove('hidden');
  if (isMobile) introMsg('카메라와 움직임 센서 권한이 필요해요');
  else { $('btn-start').textContent = '같이 놀기'; introMsg('PC에서는 화면 속에서 놀 수 있어요.\n폰으로 열면 책상 위 AR로 볼 수 있어요.'); }
})();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  if (mode !== 'preview') return;
  controls.update();
  if (model && stage.visible) animate(dt);
  renderer.render(previewScene, previewCam);
});
addEventListener('resize', () => {
  previewCam.aspect = innerWidth / innerHeight; previewCam.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
