<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>책상 위 젤리 친구</title>
<style>
:root{--g1:#eaffc9;--g2:#c8f28c;--g3:#8fdc3a;--ink:#1f4a06;--yel:#ffe45c;--cream:#fffbe8;--sub:#4f7a22}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#d9f5ae;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-user-select:none;user-select:none}
#camvid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none;background:#000}
#app{position:fixed;inset:0;z-index:1}
#app canvas{display:block;touch-action:none}
.hidden{display:none!important}

/* ── 시작 화면 ── */
#intro{position:fixed;inset:0;z-index:3;overflow:hidden;background:radial-gradient(120% 70% at 50% 35%,#f6ffe4 0%,var(--g1) 40%,var(--g2) 100%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(56px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom))}
#intro .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(143,220,58,.25) 3px,transparent 3.5px);background-size:28px 28px;pointer-events:none}
.blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none}
.deco{position:absolute;pointer-events:none}
.hello{position:relative;text-align:center;color:var(--ink)}
.hello b{display:block;font-size:30px;font-weight:900;letter-spacing:-.5px}
.hello span{display:block;margin-top:8px;font-size:15px;color:var(--sub)}
.stagepic{position:relative;width:240px;height:260px;flex:none}
.stagepic .plate{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:220px;height:44px;border-radius:50%;background:radial-gradient(#b9e57a,#9bd456);border:3px solid var(--ink)}
.stagepic svg.jelly{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);animation:boing 1.1s ease-in-out infinite;transform-origin:50% 100%}
@keyframes boing{0%,100%{transform:translateX(-50%) scale(1.06,.94)}50%{transform:translateX(-50%) translateY(-14px) scale(.96,1.04)}}
@media (prefers-reduced-motion:reduce){.stagepic svg.jelly{animation:none}}
.ctas{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.cta{display:flex;align-items:center;justify-content:center;width:min(270px,100%);height:66px;border-radius:999px;background:linear-gradient(#a8ea55,var(--g3));border:3px solid var(--ink);box-shadow:inset 0 6px 0 rgba(255,255,255,.55),0 6px 0 var(--ink);font-weight:900;font-size:21px;line-height:1;color:var(--ink);cursor:pointer;text-decoration:none;font-family:inherit}
.cta:active{transform:translateY(4px);box-shadow:inset 0 6px 0 rgba(255,255,255,.55),0 2px 0 var(--ink)}
.cta[disabled]{opacity:.55;pointer-events:none}
#ql{display:block;line-height:0}
#ql img{width:270px;height:72px;display:block}
#ql.wait{opacity:.55;pointer-events:none}
.sub{background:none;border:0;font-weight:600;font-size:15px;line-height:1;color:var(--sub);padding:10px;cursor:pointer;font-family:inherit}
#intro-msg{position:relative;font-size:12.5px;color:#5e8338;text-align:center;line-height:1.5;white-space:pre-line;min-height:19px}

/* ── 놀이 화면 (프레임 + 버튼) ── */
#hud{position:fixed;inset:0;z-index:2;pointer-events:none;display:none}
#hud.on{display:block}
.frame{position:absolute;inset:0;border:14px solid var(--g2);border-radius:44px;box-shadow:inset 0 0 0 3px var(--ink),inset 0 0 0 9px rgba(255,255,255,.5)}
@media (min-width:700px){.frame{border-radius:28px}}
#hint{position:absolute;left:50%;top:max(58px,calc(env(safe-area-inset-top) + 40px));transform:translateX(-50%);background:rgba(255,251,232,.95);border:2.5px solid var(--ink);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;max-width:calc(100% - 140px);overflow:hidden;text-overflow:ellipsis}
#close{position:absolute;top:max(50px,calc(env(safe-area-inset-top) + 32px));right:30px;width:46px;height:46px;border-radius:50%;background:var(--cream);border:3px solid var(--ink);font-weight:900;font-size:20px;line-height:1;color:var(--ink);pointer-events:auto;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#bar{position:absolute;left:24px;right:24px;bottom:max(32px,calc(env(safe-area-inset-bottom) + 18px));max-width:460px;margin:0 auto;height:108px;border-radius:30px;background:linear-gradient(#f2ffd9,var(--g2));border:3px solid var(--ink);box-shadow:inset 0 5px 0 rgba(255,255,255,.7),0 5px 0 var(--ink);display:flex;justify-content:space-around;align-items:center;padding:0 4px;pointer-events:auto}
#bar button{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:4px 0;font-weight:800;font-size:12px;line-height:1;color:var(--ink);cursor:pointer;font-family:inherit;min-width:56px}
#bar i{width:52px;height:52px;border-radius:50%;background:var(--cream);border:3px solid var(--ink);box-shadow:inset 0 -5px 0 rgba(143,220,58,.35);display:flex;align-items:center;justify-content:center;transition:transform .12s}
#bar button.on i{background:var(--yel)}
#bar button:active i{transform:scale(.9)}
#bar.off{opacity:.5;pointer-events:none}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<!-- 놀이 화면 UI (안드로이드 AR에서는 이 부분이 카메라 위에 떠요) -->

    <button data-act="thud"><i><svg width="30" height="26" viewBox="0 0 30 24"><text x="15" y="18" text-anchor="middle" font-weight="900" font-size="15" fill="#1f4a06">쿵</text></svg></i>쿵</button>
    <button data-act="surprise"><i><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1f4a06" stroke-width="3" stroke-linecap="round"><path d="M12 4v10"/><circle cx="12" cy="19.5" r="1.2" fill="#1f4a06"/></svg></i>놀라기</button>

</div>

<!-- 시작 화면 -->
<div id="intro">
  <div class="dots"></div>
  <div class="blob" style="width:140px;height:140px;left:-40px;top:40px"></div>
  <div class="blob" style="width:90px;height:90px;right:-20px;top:38%"></div>
  <div class="blob" style="width:60px;height:60px;left:30px;bottom:26%"></div>
  <svg class="deco" style="left:40px;top:30%" width="34" height="34" viewBox="0 0 24 24"><path d="M12 2l2.6 6.6L21 9.3l-5 4.4 1.6 6.8L12 17l-5.6 3.5L8 13.7 3 9.3l6.4-.7z" fill="#ffe45c" stroke="#1f4a06" stroke-width="1.6" stroke-linejoin="round"/></svg>
  <svg class="deco" style="right:44px;top:26%" width="26" height="26" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="#ffb3c7" stroke="#1f4a06" stroke-width="1.6"/></svg>
  <svg class="deco" style="right:60px;top:60%" width="22" height="28" viewBox="0 0 20 26"><path d="M10 2C10 2 2 12 2 17a8 8 0 0 0 16 0C18 12 10 2 10 2z" fill="#dff7ff" stroke="#1f4a06" stroke-width="1.6"/></svg>
  <div class="hello"><b>안녕! 같이 놀자</b><span>책상 위에 친구를 불러 볼까요?</span></div>
  <div class="stagepic"><div class="plate"></div>
    <!-- 시작 화면용 젤리 실루엣 (그림) -->
    <svg class="jelly" width="150" height="190" viewBox="0 0 150 190">
      <ellipse cx="50" cy="176" rx="24" ry="11" fill="#7fe02a" stroke="#1f4a06" stroke-width="3"/>
      <ellipse cx="100" cy="176" rx="24" ry="11" fill="#7fe02a" stroke="#1f4a06" stroke-width="3"/>
      <path d="M20 112 Q2 126 10 140 Q24 136 30 122Z" fill="#7fe02a" stroke="#1f4a06" stroke-width="3" stroke-linejoin="round"/>
      <path d="M130 112 Q148 126 140 140 Q126 136 120 122Z" fill="#7fe02a" stroke="#1f4a06" stroke-width="3" stroke-linejoin="round"/>
      <path d="M22 80 Q22 14 75 14 Q128 14 128 80 L128 150 Q128 172 75 172 Q22 172 22 150Z" fill="#8ff23a" stroke="#1f4a06" stroke-width="3"/>
      <path d="M36 70 Q38 30 70 26" fill="none" stroke="#d8ff9e" stroke-width="7" stroke-linecap="round" opacity=".8"/>
      <circle cx="52" cy="66" r="6" fill="#0b1a3a"/><circle cx="98" cy="66" r="6" fill="#0b1a3a"/>
      <ellipse cx="38" cy="84" rx="8" ry="6" fill="#d6e84a"/><ellipse cx="112" cy="84" rx="8" ry="6" fill="#d6e84a"/>
      <rect x="50" y="76" width="50" height="11" rx="5.5" fill="#b7ff62" stroke="#1f4a06" stroke-width="2"/>
      <rect x="50" y="88" width="50" height="11" rx="5.5" fill="#b7ff62" stroke="#1f4a06" stroke-width="2"/>
    </svg>

  <div class="ctas">
    <button id="btn-ar" class="cta hidden">책상에 올려놓기</button>
    <a id="ql" class="hidden wait" rel="ar" href="#"><img id="ql-img" alt="책상에 올려놓기"></a>
    <button id="btn-3d" class="cta hidden">같이 놀기</button>
    <button id="btn-cam" class="sub hidden">카메라로 놀아주기 ›</button>

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { USDZExporter } from 'three/addons/exporters/USDZExporter.js';

/* ───────── 설정 ───────── */
const MODEL_URL = 'character.glb';
const MODEL_USDZ = 'character.usdz';   // 있으면 아이폰 '책상에 올려놓기'에 사용
const AR_HEIGHT_M = 0.10;                     // AR에서 캐릭터 키 10cm

/* ───────── 기기 구분 ───────── */
const UA = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isMobile = isIOS || /Android|Mobi/i.test(UA);
const $ = (id) => document.getElementById(id);
const introMsg = (t) => { $('intro-msg').textContent = t; };

/* ───────── 장면 ───────── */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;
$('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const BG = new THREE.Color().setRGB(1.0, 0.92, 0.74, THREE.LinearSRGBColorSpace);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 60);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 2; controls.maxDistance = 7; controls.maxPolarAngle = Math.PI * 0.47;
controls.enabled = false;

// 미리보기용 바닥 원판
const floorDisc = new THREE.Mesh(new THREE.CircleGeometry(1.7, 64).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: new THREE.Color().setRGB(0.62, 0.86, 0.33, THREE.LinearSRGBColorSpace) }));
const discRim = new THREE.Mesh(new THREE.RingGeometry(1.7, 1.76, 64).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: new THREE.Color().setRGB(0.02, 0.12, 0, THREE.LinearSRGBColorSpace) }));
discRim.position.y = 0.001;
const previewFloor = new THREE.Group(); previewFloor.add(floorDisc, discRim); previewFloor.visible = false;
scene.add(previewFloor);

/* ───────── 툰 재질 (블렌더 노드 색 그대로) ───────── */
const L = (r, g, b) => new THREE.Color().setRGB(r, g, b, THREE.LinearSRGBColorSpace);
const PALETTE = {
  Jelly_Body:   { shadow: L(0.165,0.581,0.048), lit: L(0.321,0.971,0.074), rim: L(0.75,1,0.295),  spec: 0.9 },
  Jelly_Green:  { shadow: L(0.165,0.581,0.048), lit: L(0.321,0.971,0.074), rim: L(0.75,1,0.295),  spec: 0.9 },
  Jelly_Lip:    { shadow: L(0.295,0.75,0.087),  lit: L(0.581,1,0.191),     rim: L(0.88,1,0.49),   spec: 0.6 },
  Eye_Navy:     { shadow: L(0.0,0.01,0.06),     lit: L(0.01,0.03,0.12),    rim: L(0.01,0.03,0.12),spec: 1.0 },
  Cheek_Yellow: { shadow: L(0.45,0.62,0.05),    lit: L(0.62,0.82,0.1),     rim: L(0.62,0.82,0.1), spec: 0.3 },
};
const OUTLINE = L(0.02, 0.12, 0.0);
function toonMaterial(p) {
  return new THREE.ShaderMaterial({
    uniforms: { uShadow: { value: p.shadow }, uLit: { value: p.lit }, uRim: { value: p.rim }, uSpec: { value: p.spec },
      uLight: { value: new THREE.Vector3(0.45, 0.75, 0.5).normalize() } },
    vertexShader: `varying vec3 vN; varying vec3 vV;
      void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform vec3 uShadow, uLit, uRim, uLight; uniform float uSpec; varying vec3 vN; varying vec3 vV;
      void main(){ vec3 n = normalize(vN); vec3 v = normalize(vV);
        float d = dot(n, uLight) * 0.5 + 0.5;
        vec3 c = mix(uShadow, uLit, smoothstep(0.45, 0.5, d));
        float rim = smoothstep(0.55, 0.75, 1.0 - max(dot(n, v), 0.0));
        c = mix(c, uRim, rim * 0.7);
        float sp = smoothstep(0.965, 0.975, dot(n, normalize(uLight + v)));
        c = mix(c, vec3(1.0, 1.0, 0.88), sp * uSpec);
        gl_FragColor = vec4(c, 1.0);
        #include <colorspace_fragment>
      }`,
  });
}
const outlineMat = new THREE.MeshBasicMaterial({ color: OUTLINE });
const eyeMat = toonMaterial(PALETTE.Eye_Navy);

/* ───────── 캐릭터 뼈대 ─────────
   stage(위치·방향·크기) → hopper(점프 높이·기울기) → tipper(넘어지기) → squasher(찌부) → model */
const stage = new THREE.Group(); stage.visible = false; scene.add(stage);
const hopper = new THREE.Group(); stage.add(hopper);
const tipper = new THREE.Group(); hopper.add(tipper);
const squasher = new THREE.Group(); tipper.add(squasher);

// 바닥 그림자 (동그란 그림자)
function radialTex() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(64, 64, 8, 64, 64, 64);
  gr.addColorStop(0, 'rgba(40,60,10,0.45)'); gr.addColorStop(1, 'rgba(40,60,10,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 1.1).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ map: radialTex(), transparent: true, depthWrite: false }));
shadow.position.y = 0.004; shadow.renderOrder = -1; stage.add(shadow);

let model = null, parts = {}, base = {}, frontZ = 0.3, chevrons = {}, meshes = [];
const PART_NAMES = ['Jelly_Arm_L','Jelly_Arm_R','Jelly_Foot_L','Jelly_Foot_R','Jelly_Eye_L','Jelly_Eye_R','Jelly_Cheek_L','Jelly_Cheek_R','Jelly_Body'];

function stroke(x1, y1, x2, y2, r) {
  const len = Math.hypot(x2 - x1, y2 - y1);
  const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 4, 10), eyeMat);
  m.position.set((x1 + x2) / 2, (y1 + y2) / 2, 0);
  m.rotation.z = Math.atan2(y2 - y1, x2 - x1) - Math.PI / 2;
  return m;
}
function makeEyeShapes(eye, side) {
  // side: +1 = 캐릭터 왼쪽(화면 오른쪽) → '<',  -1 = 캐릭터 오른쪽(화면 왼쪽) → '>'
  const body = parts.Jelly_Body;
  const happy = new THREE.Group(), closed = new THREE.Group();
  const w = 0.042, h = 0.034, r = 0.011;
  if (side < 0) { happy.add(stroke(-w, h, w, 0, r), stroke(-w, -h, w, 0, r)); }      // >
  else { happy.add(stroke(w, h, -w, 0, r), stroke(w, -h, -w, 0, r)); }              // <
  closed.add(stroke(-w * 1.1, 0.004, w * 1.1, 0.004, r));
  for (const g of [happy, closed]) {
    g.position.copy(eye.position); g.position.z += 0.012;
    g.rotation.y = side * 0.32; g.visible = false; body.add(g);
  }
  return { happy, closed };
}

function setupModel(gltf) {
  model = gltf.scene;
  model.traverse((o) => {
    if (o.name) parts[o.name] = o;
    if (o.isMesh) {
      const n = o.material.name;
      o.material = n === 'Jelly_Outline' ? outlineMat : (PALETTE[n] ? toonMaterial(PALETTE[n]) : o.material);
      o.frustumCulled = false; meshes.push(o);
    }
  });
  // 키를 1로 맞추고 발밑을 바닥(0)에
  const box = new THREE.Box3().setFromObject(model); const size = box.getSize(new THREE.Vector3());
  const s = 1 / size.y; model.scale.setScalar(s);
  box.setFromObject(model); const c = box.getCenter(new THREE.Vector3());
  model.position.set(-c.x, -box.min.y, -c.z);
  box.setFromObject(model);
  frontZ = box.max.z * 0.85;
  tipper.position.z = frontZ; squasher.position.z = -frontZ;   // 넘어질 때 앞쪽 발끝을 축으로
  squasher.add(model);
  for (const n of PART_NAMES) if (parts[n]) base[n] = { p: parts[n].position.clone(), q: parts[n].quaternion.clone(), s: parts[n].scale.clone() };
  if (parts.Jelly_Eye_L) chevrons.L = makeEyeShapes(parts.Jelly_Eye_L, +1);
  if (parts.Jelly_Eye_R) chevrons.R = makeEyeShapes(parts.Jelly_Eye_R, -1);
}

/* ───────── 말 풍선·하트 (스프라이트) ───────── */
function heartTex() {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  g.translate(64, 70); g.lineJoin = 'round';
  const path = () => { g.beginPath(); g.moveTo(0, 40); g.bezierCurveTo(-60, 0, -40, -52, 0, -22); g.bezierCurveTo(40, -52, 60, 0, 0, 40); g.closePath(); };

/* ───────── 말랑말랑 스프링 ───────── */
const spring = (x = 0) => ({ x, v: 0 });

/* ───────── 동작 ───────── */
let act = null, walk = null, popT = 1, S = 1;

function play(type) {

function endAct() { act = null; document.querySelectorAll('#bar button').forEach((b) => b.classList.remove('on')); }

const tmpV = new THREE.Vector3(), tmpQ = new THREE.Quaternion(), Z = new THREE.Vector3(0, 0, 1), X = new THREE.Vector3(1, 0, 0);

/* ───────── 놓기 · 걷기 · 탭 ───────── */
let placed = false, mode = 'none', floorY = 0;

function placeAt(pt) {

}
function walkTo(pt) {

// 화면 탭 (PC 미리보기 · 아이폰 카메라 모드)

      if (!o.isMesh) return;
      if (o.material === outlineMat || o.material === eyeMat) { drop.push(o); return; }   // 외곽선 껍데기·> < 눈은 빼기
      const p = Object.values(PALETTE).find((pp) => o.material.uniforms && o.material.uniforms.uLit.value === pp.lit) || PALETTE.Jelly_Green;
      o.material = new THREE.MeshStandardMaterial({ color: p.lit.clone(), roughness: 0.55 });
    });
    drop.forEach((o) => o.parent.remove(o));
    holder.add(clone); holder.scale.setScalar(AR_HEIGHT_M); holder.updateMatrixWorld(true);
    const ex = new USDZExporter();
    const data = ex.parseAsync ? await ex.parseAsync(holder) : await ex.parse(holder);
    url = URL.createObjectURL(new Blob([data], { type: 'model/vnd.usdz+zip' }));
  }
  $('ql').href = url; $('ql').classList.remove('wait');
}

/* ───────── 시작 ───────── */
async function boot() {
  $('ql-img').src = quickLookButtonSVG();
  let xrOK = false;
  if (!isIOS && window.isSecureContext && navigator.xr) { try { xrOK = await navigator.xr.isSessionSupported('immersive-ar'); } catch (e) {} }
  const camOK = isMobile && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && window.isSecureContext;

  try { setupModel(await new GLTFLoader().loadAsync(MODEL_URL)); }
  catch (e) { console.error(e); introMsg('친구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'); return; }

  if (isIOS) {
    $('ql').classList.remove('hidden'); if (camOK) $('btn-cam').classList.remove('hidden');
    introMsg('카메라 사용 권한이 필요해요');
    try { await prepareQuickLook(); } catch (e) { console.error(e); introMsg('애플 AR 파일을 만들지 못했어요. "카메라로 놀아주기"를 써 주세요.'); }
  } else if (xrOK) {
    $('btn-ar').classList.remove('hidden'); if (camOK) $('btn-cam').classList.remove('hidden');
    introMsg('카메라 사용 권한이 필요해요');
  } else if (isMobile) {
    if (camOK) { $('btn-cam').classList.remove('hidden'); $('btn-cam').className = 'cta'; $('btn-cam').textContent = '카메라로 놀아주기'; }
    $('btn-3d').classList.remove('hidden'); $('btn-3d').className = 'sub'; $('btn-3d').textContent = '화면에서 놀기 ›';
    introMsg(window.isSecureContext ? '이 폰은 책상 인식 AR을 지원하지 않아요.\n카메라 모드로 놀 수 있어요.' : 'AR은 https 주소에서만 실행돼요.');
  } else {
    $('btn-3d').classList.remove('hidden');
    introMsg('PC에서는 화면 속에서 놀 수 있어요.\n폰으로 열면 책상 위 AR로 볼 수 있어요.');
  }
}
boot();

/* ───────── 매 프레임 ───────── */
const clock = new THREE.Clock();
renderer.setAnimationLoop((time, frame) => {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  if (frame && hitSource) {
    const res = frame.getHitTestResults(hitSource);
    if (res.length) {
      const pose = res[0].getPose(renderer.xr.getReferenceSpace());
      reticle.matrix.fromArray(pose.transform.matrix);
      const up = new THREE.Vector3().setFromMatrixColumn(reticle.matrix, 1);
      reticle.visible = up.y > 0.85; reticlePos.setFromMatrixPosition(reticle.matrix);
    } else reticle.visible = false;
    reticle.scale.setScalar(placed ? 0.6 : 1);
    setHint(placed ? '한 번 탭: 걸어가기 · 두 번 탭: 원 위치로 이동' : reticle.visible ? '원이 보이면 화면을 탭하세요' : '책상을 천천히 비춰 주세요');
  } else if (mode === 'preview') controls.update();
  if (model && stage.visible) animate(dt);
  renderer.render(scene, camera);
});
addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
</script>
